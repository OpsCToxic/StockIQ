services:
  db:
    # TimescaleDB HA image ships Postgres 16 with timescaledb + pgvector
    image: timescale/timescaledb-ha:pg16
    # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB come from .env (see .env.example)
    env_file: .env
    ports: ["127.0.0.1:5432:5432"]
    volumes: [db-data:/home/postgres/pgdata/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stockiq}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redis-data:/data]

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    # MINIO_ROOT_USER / MINIO_ROOT_PASSWORD come from .env (see .env.example)
    env_file: .env
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [minio-data:/data]

  api:
    build: .
    # Only the variables the API needs are passed in, not the whole .env (which also holds API keys).
    # ${VAR} is filled from .env; the host names point at the other containers.
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      S3_ENDPOINT_URL: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    # No login on the API: published on localhost only. Use Tailscale or an auth proxy to expose it.
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  redis-data:
  minio-data:
